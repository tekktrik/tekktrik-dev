services:
  test-app:
    build:
      context: ../
      dockerfile: docker/app/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ../data:/app/data
      - ../media:/app/media
    depends_on:
      - test-cache
    env_file:
      - ../.env
  test-cache:
    build:
      context: ../
      dockerfile: docker/cache/Dockerfile
    volumes:
      - ../data:/cache/data
      - ../media:/cache/media
    env_file:
      - ../.env
